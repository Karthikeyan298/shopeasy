server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to the api-gateway
    # This avoids CORS issues — the browser only ever talks to port 8888
    location /api/ {
        proxy_pass         http://api-gateway.shopeasy.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Healthcheck endpoint
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"storefront"}';
        add_header Content-Type application/json;
    }
}

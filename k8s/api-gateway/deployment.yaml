---
# ── ConfigMap ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: shopeasy
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: shopeasy
data:
  USER_SERVICE_URL:    "http://user-service:5001"
  PRODUCT_SERVICE_URL: "http://product-service:8080"
  ORDER_SERVICE_URL:   "http://order-service:5002"
  PORT:                "3000"

---
# ── Deployment ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopeasy
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: shopeasy
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: "1.0.0"
    spec:
      containers:
        - name: api-gateway
          image: shopeasy/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-gateway-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

---
# ── Service ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopeasy
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: shopeasy
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

---
# ── ConfigMap ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
  namespace: shopeasy
  labels:
    app: product-service
    app.kubernetes.io/part-of: shopeasy
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT:             "8080"

---
# ── Deployment ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopeasy
  labels:
    app: product-service
    app.kubernetes.io/part-of: shopeasy
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        version: "1.0.0"
    spec:
      containers:
        - name: product-service
          image: shopeasy/product-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: product-service-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

---
# ── Service ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shopeasy
  labels:
    app: product-service
    app.kubernetes.io/part-of: shopeasy
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
